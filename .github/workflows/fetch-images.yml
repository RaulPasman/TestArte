name: Bajar fotos de las obras

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bajar-fotos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr el script (baja las fotos)
        run: python scripts/fetch_images.py

      - name: Guardar las fotos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img img-manifest.json
          git diff --staged --quiet && echo "Sin cambios para subir" && exit 0
          git commit -m "Actualiza fotos de obras (automático)"
          git push
